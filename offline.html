<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101715">
  <meta name="description" content="Offline chess classes in Nolambur, Chennai.">
  <title>Offline classes | Little Shishyas Chess Academy</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #17201b; background: #f8f6ef; font-size: 16px; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #dbab42; outline-offset: 4px; }
    .wrap { width: min(1100px, calc(100% - 40px)); margin: 0 auto; }
    .top { background: #101715; color: #fff; }
    .nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { color: #f4d280; font: bold 1.1rem Georgia, serif; text-decoration: none; }
    .back { color: #f6e5b8; text-decoration: none; }
    main { padding: 56px 0 72px; }
    .detail { display: grid; grid-template-columns: 1fr minmax(280px, .8fr); gap: 56px; align-items: center; }
    .eyebrow { color: #8d651a; font-size: .8rem; font-weight: 700; text-transform: uppercase; }
    h1, h2 { font-family: Georgia, 'Times New Roman', serif; }
    h1 { margin: 12px 0 18px; font-size: clamp(2.6rem, 6vw, 4.6rem); line-height: 1.04; }
    .description, .schedule { color: #4b554e; line-height: 1.7; }
    .schedule { margin-top: 22px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .btn { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border: 1px solid #16211b; border-radius: 4px; background: #16211b; color: #fff; font-weight: 700; text-decoration: none; }
    .btn-secondary { background: transparent; color: #16211b; }
    figure { margin: 0; padding: 10px; background: #fff; border: 1px solid #d9d6ca; }
    figure img { display: block; width: 100%; height: auto; }
    figure a { display: block; }
    figcaption { padding: 12px 4px 2px; color: #4b554e; font-size: .9rem; }
    .features { margin-top: 64px; padding-top: 32px; border-top: 1px solid #d9d6ca; }
    h2 { margin: 0 0 20px; font-size: 2rem; }
    .feature-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .feature { padding-top: 14px; border-top: 3px solid #c59942; font-weight: 700; line-height: 1.5; }
    .contact { margin-top: 54px; padding: 24px 0; border-top: 1px solid #d9d6ca; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
    .contact a { color: #745118; font-weight: 700; text-decoration: none; }
    .footer { padding: 22px 0; background: #101715; color: #e1e4dc; }
    .footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .footer a { color: #f4d280; }
    @media (max-width: 700px) {
      .nav { min-height: 64px; }
      main { padding: 36px 0 48px; }
      .detail { grid-template-columns: 1fr; gap: 34px; }
      .feature-list { grid-template-columns: repeat(2, 1fr); }
      .features { margin-top: 44px; }
    }
    @media (max-width: 420px) {
      .wrap { width: min(100% - 32px, 1100px); }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
      .feature-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap nav">
      <a class="brand" href="index.html">Little Shishyas Chess Academy</a>
      <a class="back" href="index.html#classes">Back to classes</a>
    </div>
  </header>
  <main class="wrap">
    <section class="detail" aria-labelledby="class-title">
      <div>
        <div class="eyebrow">In-person coaching · Chennai</div>
        <h1 id="class-title">Offline classes</h1>
        <p class="description" id="class-description">Chess coaching in Nolambur, Chennai.</p>
        <p class="schedule" id="class-schedule"></p>
        <div class="actions">
          <a class="btn" id="enquiry" href="https://wa.me/" target="_blank" rel="noopener noreferrer">Enquire on WhatsApp</a>
          <a class="btn btn-secondary" href="index.html#classes">Explore other classes</a>
        </div>
      </div>
      <figure>
        <a id="poster-link" href="offline-poster.jpg" target="_blank" rel="noopener noreferrer">
          <img id="poster" src="offline-poster.jpg" alt="Offline chess class poster">
        </a>
        <figcaption>Class information and enrollment details</figcaption>
      </figure>
    </section>
    <section class="features" aria-labelledby="features-title">
      <h2 id="features-title">Coaching that grows with your child</h2>
      <div class="feature-list" id="feature-list"></div>
    </section>
    <section class="contact" aria-label="Contact information">
      <strong id="academy-name">Little Shishyas Chess Academy</strong>
      <div id="phone-list"></div>
    </section>
  </main>
  <footer class="footer"><div class="wrap"><span>Little Shishyas Chess Academy</span><a href="index.html">Home</a></div></footer>
  <script>
    (async () => {
      const modeKey = 'offline';
      const posterFile = 'offline-poster.jpg';
      try {
        const response = await fetch('content.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error('Content request failed: ' + response.status);
        const settings = await response.json();
        const mode = settings.classes[modeKey];
        document.title = mode.title + ' | ' + settings.academy.name;
        document.querySelector('meta[name="description"]').content = mode.description;
        document.querySelector('.brand').textContent = settings.academy.name;
        document.querySelector('#academy-name').textContent = settings.academy.name;
        document.querySelector('#class-title').textContent = mode.title;
        document.querySelector('#class-description').textContent = mode.description;
        document.querySelector('#class-schedule').textContent = mode.schedule;
        document.querySelector('#poster').src = posterFile;
        document.querySelector('#poster-link').href = posterFile;
        document.querySelector('#poster').alt = mode.title + ' poster';
        document.querySelector('#enquiry').href = 'https://wa.me/' + settings.contact.whatsappNumber + '?text=' + encodeURIComponent(settings.contact.whatsappMessage);
        document.querySelector('#feature-list').replaceChildren(...settings.classes.features.map(label => {
          const item = document.createElement('div');
          item.className = 'feature';
          item.textContent = label;
          return item;
        }));
        document.querySelector('#phone-list').replaceChildren(...settings.contact.phones.map(phone => {
          const link = document.createElement('a');
          link.href = 'tel:' + phone.replace(/[^+\d]/g, '');
          link.textContent = phone;
          link.style.marginLeft = '16px';
          return link;
        }));
      } catch (error) {
        console.error('Unable to load class details from content.json.', error);
      }
    })();
  </script>
</body>
</html>
