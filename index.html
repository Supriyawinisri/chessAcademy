        .benefit:nth-child(4) { background: #eae9df }

        .benefit:nth-child(5) { background: #f3ead0 }

        .benefit-action .btn { width: fit-content }

        .benefit-action .btn:focus-visible { outline-color: #dbab42 }

        .benefit-action .btn:hover { box-shadow: 0 6px 18px #17201b20; transform: translateY(-2px) }

        .benefit-action .btn { transition: background-color .18s ease, box-shadow .18s ease, transform .18s ease }

        .faq-list {

        .faq-item summary {
            min-height: 64px;

        }

        .faq-item summary::-webkit-details-marker { display: none }

        .faq-item summary::after {
            content: "+";
            flex: 0 0 32px;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;

        }

        .faq-item[open] summary::after { content: "−"; background: #eac46e; transform: rotate(180deg) }

        .faq-item p {
            max-width: 720px;

            font-size: 2.1rem;

        }

        .price small {
            font-size: .9rem;

        .note {

        }

        .phone {

        .footer {

        }

        .footer .wrap {

        }

        .footer a {

        .sr-only {

        }

        @media(max-width:750px) {
            .top {
                border-bottom: 1px solid #eac46e33
            }

            .hero-inner {
                grid-template-columns: 1fr;

            }

            .hero-art {

            }

            .contact-grid {

            .benefit { min-height: 0; padding: 18px; }

            .benefit-action .btn { width: 100% }

    </style>
</head>

<body>
    <header class="top">
        <div class="wrap nav"><a class="brand" href="#home"><span class="brandmark" aria-hidden="true">♛</span><span></span></a>
            <nav class="navlinks"><a href="#why-chess"></a><a href="courses.html"></a><a href="#questions"></a><a href="#contact"></a></nav>
        </div>
    </header>
    <main>
        <section id="home" class="hero">
            <div class="wrap hero-inner">
                <div>
                    <div class="eyebrow"></div>
                    <h1></h1>
                    <p class="lead"></p>
                    <div class="actions"><a class="btn btn-gold" target="_blank" rel="noopener noreferrer"></a><a class="btn btn-outline" href="courses.html"></a></div>
                </div>
                <div class="hero-art" aria-hidden="true">
                    <div class="board" id="board"></div>
                </div>
            </div>
        </section>
        <section class="section" id="why-chess">
            <div class="wrap">
                <div class="kicker"></div>
                <h2></h2>
                <p class="intro"></p>
                <div class="benefits"></div>
                <div class="benefit-action"><a class="btn btn-dark" href="courses.html"></a></div>
            </div>
        </section>
        <section class="section alt" id="questions">
            <div class="wrap">
                <div class="kicker"></div>
                <h2></h2>
                <p class="intro"></p>
                <div class="faq-list"></div>
            </div>
        </section>
        <section class="section contact" id="contact">
            <div class="wrap contact-grid">
                <div>
                    <div class="kicker"></div>
                    <h2></h2>
                    <address></address>
                    <p><a class="btn btn-outline" id="directions-link" target="_blank" rel="noopener noreferrer"></a></p>
                </div>
                <div>
                    <div class="kicker"></div>
                    <h2></h2>
                    <div class="actions"><a class="btn btn-gold" target="_blank" rel="noopener noreferrer"></a></div>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="wrap"><span></span><a href="#home"></a></div>
    </footer>
    <script>
(async () => {
  'use strict';
  let settings;
  try {
    const response = await fetch('content.json', { cache: 'no-cache' });
    if (!response.ok) throw new Error('Content request failed: ' + response.status);
    settings = await response.json();
  } catch (error) {
    console.error('Unable to load content.json.', error);
    return;
  }
    const { academy, hero, navigation, whyChess, faq, contact, footer } = settings;
  const find = selector => document.querySelector(selector);
  const text = (selector, value) => { const node = find(selector); if (node) node.textContent = value; };
  const element = (tag, className, value) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = value;
    return node;
  };
  const lines = (selector, values) => {
    const node = find(selector);
    node.replaceChildren();
    values.forEach((value, i) => {
      if (i) node.append(document.createElement('br'));
      node.append(document.createTextNode(value));
    });
  };
  const list = (selector, values, render) => find(selector).replaceChildren(...values.map(render));
  find('.navlinks').setAttribute('aria-label', navigation.accessibleLabel);
  document.title = settings.page.title;
  find('meta[name="description"]').content = settings.page.description;
  lines('.brand > span:last-child', academy.brandLines);
    const navItems = [['#why-chess', navigation.whyChess], ['courses.html', navigation.courses], ['#questions', navigation.questions], ['#contact', navigation.contact]];
  navItems.forEach(([href, label]) => text(`.navlinks a[href="${href}"]`, label));
  text('.eyebrow', hero.tagline);
  find('h1').replaceChildren(document.createTextNode(hero.headline), document.createElement('br'), element('em', '', hero.emphasis));
  text('.lead', hero.description);
  text('#home .btn-outline', hero.coursesLabel);
    find('#home .btn-outline').href = 'courses.html';
  text('#why-chess .kicker', navigation.whyChess);
  text('#why-chess h2', whyChess.heading);
  text('#why-chess .intro', whyChess.introduction);
    list('.benefits', whyChess.benefits, (label, i) => {
    const node = element('div', 'benefit');
        node.style.setProperty('--benefit-index', i);
        node.append(element('span', 'benefit-number', String(i + 1).padStart(2, '0')), element('h3', '', label), element('p', '', whyChess.benefitDescriptions[i]));
    return node;
  });
    text('.benefit-action .btn', whyChess.coursesLinkLabel);
    text('#questions .kicker', navigation.questions);
    text('#questions h2', faq.heading);
    text('#questions .intro', faq.introduction);
    list('.faq-list', faq.items, item => {
        const detail = element('details', 'faq-item');
        detail.append(element('summary', '', item.question), element('p', '', item.answer));
        return detail;
    });
  text('#contact .contact-grid > div:first-child .kicker', contact.visitLabel);
  text('#contact .contact-grid > div:first-child h2', academy.name);
  lines('#contact address', academy.address);
    const directionsLink = find('#directions-link');
    directionsLink.href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(academy.address.join(', '));
    directionsLink.textContent = contact.directionsLabel;
  text('#contact .contact-grid > div:last-child .kicker', contact.contactLabel);
  text('#contact .contact-grid > div:last-child h2', contact.heading);
  document.querySelectorAll('#contact .phone').forEach(node => node.remove());
  const phoneArea = find('#contact .contact-grid > div:last-child');
  const actions = phoneArea.querySelector('.actions');
  contact.phones.forEach(phone => {
    const link = element('a', 'phone', phone);
    link.href = 'tel:' + phone.replace(/[^+\d]/g, '');
    phoneArea.insertBefore(link, actions);
  });
    const whatsappURL = 'https://wa.me/' + contact.whatsappNumber + '?text=' + encodeURIComponent(contact.whatsappMessage);
  ['#home .btn-gold', '#contact .btn-gold'].forEach((selector, i) => {
    const link = find(selector); link.href = whatsappURL; link.textContent = i === 0 ? hero.enquiryLabel : contact.whatsappLabel;
  });
  text('.footer .wrap > span', `© ${new Date().getFullYear()} ${academy.name}`);
  text('.footer a', footer.backToTop);
  const board = find('#board');
  board.replaceChildren();
  const pieces = { 3: '♚', 18: '♞', 39: '♟', 60: '♙' };
  for (let i = 0; i < 64; i++) {
    const square = element('div', 'sq');
    if (pieces[i]) square.append(element('span', 'piece', pieces[i]));
    board.append(square);
  }
})();
    </script>
